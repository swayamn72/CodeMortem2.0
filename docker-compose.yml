# CodeMortem Docker Compose
# Judge0 self-hosting removed — use Judge0 CE cloud API (free tier) instead.
# Set JUDGE0_URL in backend/.env to your Judge0 CE endpoint.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: codemortem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-codemortem}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-codemortem}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codemortem" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: codemortem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.25"

  # CodeMortem API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codemortem-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Set JUDGE0_URL in backend/.env to your cloud Judge0 CE endpoint
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # CodeMortem Web Frontend (disabled by default — run `npm run dev` instead)
  web:
    profiles: [ web ]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codemortem-web
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

volumes:
  postgres_data:
  redis_data:
