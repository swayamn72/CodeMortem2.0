name: Deploy to Azure VPS

on:
  push:
    branches:
      - main # This triggers the workflow when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            # ── Free up disk space ────────────────────────────────────────────
            # Remove stopped containers, dangling images, unused networks, and
            # the entire build cache. This prevents "no space left on device"
            # errors caused by Docker build cache accumulating over time.
            docker system prune -af --volumes

            # Navigate to the project directory
            cd CodeMortem2.0

            # Pull the latest code from GitHub
            git pull origin main

            # Rebuild and restart containers; --remove-orphans cleans up any
            # containers from services that were removed from docker-compose.yml
            docker compose --profile web up -d --build --remove-orphans
